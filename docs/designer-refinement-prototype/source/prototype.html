function field(label,value,unit='',id='',extra=''){return `<span class="field"><label for="${id}">${label==='↻'?icon('Rotate'):label}</label><input id="${id}" aria-label="${label||id}" type="number" value="${value}" step="0.1" ${extra}><span class="unit">${unit}</span></span>`}
function renderOps(){ $('#ops').innerHTML=operations.map((o,i)=>`<div class="op ${o.id===activeOp?'active':''}"><button data-state="${o.id}" style="height:auto;flex:1;min-width:0;justify-content:start;padding:0;text-align:left"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="swatch" style="background:${o.color}"></span><span class="optext"><strong>${o.name}</strong><small>${o.power} % · ${o.speed} mm/min</small></span></button><span class="op-actions"><button data-toggle="output" data-id="${o.id}" aria-pressed="${!o.off}" data-tip="${o.off?'Zapnout':'Vypnout'} výstup">${icon(o.off?'ZapOff':'Zap')}</button><button data-toggle="visible" data-id="${o.id}" aria-pressed="${!o.hidden}" data-tip="${o.hidden?'Zobrazit':'Skrýt'} objekt">${icon(o.hidden?'EyeOff':'Eye')}</button></span></div>`).join(''); const idx=operations.findIndex(o=>o.id===activeOp);$('#opUp').disabled=idx<=0;$('#opDown').disabled=idx<0||idx===operations.length-1;hydrate() }
function renderContext(){ let content='';if(state!=='default'){content=field('X',158.7,'','x')+field('Y',170.2,'','y')+'<span class="divider"></span>'+field('W',state==='text'?172:200,'','w')+`<button class="ib active" id="link" aria-label="Zachovat poměr stran" aria-pressed="true">${icon('Link')}</button>`+field('H',state==='text'?24:228,'','h')+'<span class="divider"></span>'+field('↻',0,'°','rotation');if(state==='text')content+='<span class="divider"></span><select aria-label="Písmo" id="font"><option>Segoe UI</option><option>Georgia</option></select>'+field('',20,'mm','fontSize')+'<button class="ib" id="bold" aria-label="Tučné" aria-pressed="false"><b>B</b></button>';if(state==='nodes')content=`<span style="padding:0 7px;font-weight:500">Úprava uzlů</span><span class="divider"></span><button id="corner" class="${!smooth?'active':''}">Rohový</button><button id="smooth" class="${smooth?'active':''}">Hladký</button><span class="divider"></span><button id="closePath">${closed?'Otevřít':'Uzavřít'} cestu</button><span class="muted" style="white-space:nowrap;padding:0 8px">${selectedNodes.size} ${selectedNodes.size===1?'uzel':'uzly'}</span><button id="endNodes">Hotovo</button>`; content+=`<button class="ib" id="more" aria-label="Další možnosti">${icon('More')}</button>`;}$('#context').innerHTML=content?`<div class="context-inner">${content}</div>`:''; }
function renderSettings(){let o=operations.find(o=>o.id===activeOp);$('#imageSettings').innerHTML=state==='image'?'<section class="section"><h2>Obrázek</h2><button class="outline" style="width:100%" id="removeBg">Odstranit pozadí</button><p>Portrét · černobílý rastr</p></section>':'';if(!o){$('#settings').innerHTML='<h2>Návrh</h2><p>Vyberte objekt nebo operaci a upravte její parametry.</p><div class="compact-property"><span>Pracovní plocha</span><span>400 × 400 mm</span></div>';return}mode=o.mode;$('#settings').innerHTML=`<h2>Nastavení operace</h2><input class="namefield" id="opname" aria-label="Název operace" value="${o.name}"><div class="row spread"><label>Materiál</label><button id="materialMenu" style="font-size:12px;height:24px">Změnit ${icon('ChevronRight')}</button></div><select aria-label="Materiál" style="width:100%;margin-top:7px" id="material"><option>Vlastní nastavení</option><option>Překližka · bříza 3 mm</option><option>Masiv · buk</option></select><div class="property"><div class="row"><label>Režim zpracování</label></div>${state==='image'?'<p>Obrázek · řádkové gravírování<br>Černobílý rastr · Stucki</p>':`<div class="segments">${['Čára','Výplň','Obojí'].map(m=>`<button data-mode="${m}" class="${m===mode?'chosen':''}">${m}</button>`).join('')}</div>`}</div><div class="property"><div class="row spread"><label for="power">Výkon</label>${field('',o.power,'%','power','min="0" max="100"')}</div><input class="range" aria-label="Výkon posuvník" id="powerRange" type="range" min="0" max="100" value="${o.power}"></div><div class="property"><div class="row spread"><label for="speed">Rychlost</label>${field('',o.speed,'mm/min','speed','min="1" max="20000"')}</div><input class="range" aria-label="Rychlost posuvník" id="speedRange" type="range" min="1" max="10000" value="${o.speed}"></div><div class="compact-property"><label for="passes">Počet průchodů</label><div class="row"><button class="ib" id="passMinus" aria-label="Ubrat průchod">−</button>${field('',1,'×','passes','min="1" max="100"')}<button class="ib" id="passPlus" aria-label="Přidat průchod">+</button></div></div>${mode==='Čára'?'':`<div class="compact-property"><label for="interval">Interval řádků</label>${field('',0.1,'mm','interval','min="0.01" max="5"')}</div><p>Menší interval vytváří jemnější výplň a prodlužuje čas gravírování.</p>`}<button class="delete" id="deleteOp">${icon('Delete')}Odstranit operaci</button>`;hydrate() }
const boxes={object:[88,94,300,342],text:[103,319,270,62],vector:[192,151,87,150],image:[424,338,108,130]};
function renderSelection(){ $('#selection').innerHTML='';$('#nodeOverlay').innerHTML='';if(state==='default')return;if(state==='nodes'){let coords=[[238,284],[259,153],[279,229]];$('#nodeOverlay').innerHTML=`<path class="selstroke" d="${closed?'M238 284 C164 257 160 182 259 153 C287 222 290 260 238 284 Z':'M238 284 C164 257 160 182 259 153 C287 222 290 260 265 275'}"/><path d="M164 257L238 284L312 311 M160 182L259 153L307 139" class="selstroke" opacity="${smooth?.55:0}"/>${(smooth?[[164,257],[312,311],[160,182],[307,139]]:[]).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" class="handle"/>`).join('')}${coords.map(([x,y],i)=>`<g data-node="${i}"><circle class="node-hit" cx="${x}" cy="${y}" r="12"/>${(selectedNodes.has(i)?smooth:i===1)?`<circle class="node ${selectedNodes.has(i)?'selected':''}" cx="${x}" cy="${y}" r="3"/>`:`<rect class="node ${selectedNodes.has(i)?'selected':''}" x="${x-3}" y="${y-3}" width="6" height="6"/>`}</g>`).join('')}`;return}let [x,y,w,h]=boxes[state];$('#selection').innerHTML=`<rect class="selstroke" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="selstroke" d="M${x+w/2} ${y}v-21"/><circle class="handle" cx="${x+w/2}" cy="${y-24}" r="3"/>${[[x,y],[x+w/2,y],[x+w,y],[x,y+h/2],[x+w,y+h/2],[x,y+h],[x+w/2,y+h],[x+w,y+h]].map(([a,b])=>`<rect class="handle" x="${a-3}" y="${b-3}" width="6" height="6"/>`).join('')}` }
function setState(s){state=s;activeOp=s==='nodes'?'vector':s==='default'?null:s;closeMenu();renderContext();renderSettings();renderOps();renderSelection();$$('#states button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===s));$$('.rail button').forEach(b=>b.classList.toggle('active',b.dataset.state===(s==='nodes'?'nodes':s==='text'?'text':'object')));if(['default','object','image','vector'].includes(s))$('#selectTool').classList.add('active');$('#hint').textContent=s==='nodes'?'Shift + kliknutí: více uzlů · Esc: ukončit úpravu':s==='default'?'Kliknutím vyberte objekt · přiblížení vpravo dole':s==='vector'?'Dvojklikem upravíte uzly cesty.':'Esc: zrušit výběr · parametry upravíte v panelu';}
function toast(t){$('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3200)}
function closeMenu(){$('.popover')?.remove()}
function menu(anchor,items){closeMenu();let d=document.createElement('div');d.className='popover';d.setAttribute('role','menu');d.innerHTML=items.map(([label,shortcut,action])=>label==='-'?'<hr>':`<button role="menuitem" data-menu-action="${action}"><span>${label}</span><kbd>${shortcut||''}</kbd></button>`).join('');document.body.append(d);let r=anchor.getBoundingClientRect();d.style.left=Math.min(r.left,innerWidth-245)+'px';d.style.top=Math.min(r.bottom+5,innerHeight-d.offsetHeight-85)+'px';d.querySelector('button')?.focus()}
$('#states').innerHTML=Object.entries(states).map(([s,l])=>`<button data-state="${s}" aria-pressed="false">${l}</button>`).join('');$('#rulerx').innerHTML=Array.from({length:19},(_,i)=>`<span>${i*25-25}</span>`).join('');$('#rulery').innerHTML=Array.from({length:14},(_,i)=>`<span>${425-i*25}</span>`).join('');$('#palette').innerHTML=['#30332d','#b95745','#747b59','#c6ac59','#528074','#6b8596','#8b7c91','#a07769','#93988b','#bdc0b7'].map(c=>`<button style="--c:${c}" data-color="${c}" aria-label="Barva ${c}"></button>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('button');const obj=e.target.closest('.object');const node=e.target.closest('[data-node]');if(node){const n=+node.dataset.node;if(e.shiftKey){selectedNodes.has(n)?selectedNodes.delete(n):selectedNodes.add(n)}else selectedNodes=new Set([n]);renderSelection();renderContext();return}if(obj){setState(obj.dataset.state);return}if(!b){if(!e.target.closest('.popover'))closeMenu();if(e.target.id==='scene'||e.target.closest('#scene')&&!e.target.closest('.object'))setState('default');return}if(b.dataset.state){setState(b.dataset.state);return}if(b.dataset.message){toast(b.dataset.message);return}let o=operations.find(o=>o.id===activeOp);if(b.dataset.mode){snapshot();o.mode=b.dataset.mode;renderSettings();renderOps()}if(b.dataset.color&&o){snapshot();o.color=b.dataset.color;renderOps()}if(b.dataset.toggle){snapshot();let a=operations.find(o=>o.id===b.dataset.id);if(b.dataset.toggle==='output')a.off=!a.off;else{a.hidden=!a.hidden;$(`.object[data-state="${a.id}"]`).style.opacity=a.hidden?'0':'1'}renderOps()}if(b.dataset.menuAction){const a=b.dataset.menuAction;closeMenu();if(a in states)setState(a);else if(a==='duplicate'&&o){snapshot();toast('Duplikování je ukázka příkazu; geometrie se v tomto prototypu nekopíruje.')}else toast('Ukázka nabídky: '+b.innerText);return}switch(b.id){case'link':b.classList.toggle('active');b.setAttribute('aria-pressed',b.classList.contains('active'));break;case'bold':b.classList.toggle('active');b.setAttribute('aria-pressed',b.classList.contains('active'));$('#arttext').style.fontWeight=b.classList.contains('active')?'700':'500';break;case'more':menu(b,[['Upravit uzly','Dvojklik','nodes'],['Zarovnat vlevo','','align'],['Zarovnat na střed','','center'],['-'],['Duplikovat','Ctrl+D','duplicate'],['Převést na křivky','','curves']]);break;case'projectMenu':menu(b,[['Nový projekt','Ctrl+N','new'],['Otevřít…','Ctrl+O','open'],['Uložit','Ctrl+S','save'],['-'],['Exportovat SVG…','','export']]);break;case'shapeMenu':menu(b,[['Obdélník','R','object'],['Elipsa','','object'],['Mnohoúhelník','','vector'],['Hvězda','','vector']]);break;case'layersMenu':menu(b,[['Obrys podtácku','','object'],['List','','vector'],['Lesní ateliér','','text'],['Portrét','','image']]);break;case'materialMenu':$('#material').focus();toast('Vyberte materiál v rozbalovacím poli. Parametry jsou pouze ilustrační.');break;case'corner':smooth=false;renderContext();renderSelection();break;case'smooth':smooth=true;renderContext();renderSelection();break;case'closePath':closed=!closed;$('#leaf').setAttribute('fill',closed?'#343c30':'none');$('#leaf').setAttribute('d',closed?'M238 284 C164 257 160 182 259 153 C287 222 290 260 238 284 Z':'M238 284 C164 257 160 182 259 153 C287 222 290 260 265 275');renderContext();renderSelection();break;case'endNodes':setState('vector');break;case'passMinus':$('#passes').value=Math.max(1,+$('#passes').value-1);break;case'passPlus':$('#passes').value=Math.min(100,+$('#passes').value+1);break;case'zoomIn':setZoom(zoom+10);break;case'zoomOut':setZoom(zoom-10);break;case'fit':case'zoomReset':setZoom(82);break;case'full':if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Celá obrazovka není dostupná.'));break;case'removeBg':b.textContent=b.textContent==='Odstranit pozadí'?'Obnovit pozadí':'Odstranit pozadí';$('.object[data-state="image"] rect').setAttribute('fill',b.textContent==='Obnovit pozadí'?'transparent':'#edeee7');break;case'opUp':case'opDown':{snapshot();let i=operations.indexOf(o),j=i+(b.id==='opUp'?-1:1);if(j>=0&&j<operations.length)[operations[i],operations[j]]=[operations[j],operations[i]];renderOps();break}case'deleteOp':toast('Odstranění operace je v tomto vizuálním prototypu pouze náhled příkazu.');break;case'undo':if(history.length){future.push(JSON.stringify(operations));operations=JSON.parse(history.pop());renderSettings();renderOps();$('#redo').disabled=false;$('#undo').disabled=!history.length}break;case'redo':if(future.length){history.push(JSON.stringify(operations));operations=JSON.parse(future.pop());renderSettings();renderOps();$('#redo').disabled=!future.length;$('#undo').disabled=false}break;}});
document.addEventListener('dblclick',e=>{if(e.target.closest('.object[data-state="vector"]'))setState('nodes')});
function setZoom(z){zoom=Math.max(42,Math.min(132,z));$('#zoomReset').textContent=zoom+' %';$('#scene').style.transform=`scale(${zoom/82})`;$('#scene').style.transformOrigin='50% 50%'}
document.addEventListener('input',e=>{let id=e.target.id,o=operations.find(o=>o.id===activeOp);if(id==='powerRange'||id==='speedRange'){let key=id.replace('Range','');$('#'+key).value=e.target.value;o[key]=+e.target.value;renderOps()}if(id==='power'||id==='speed'){let max=id==='power'?100:20000,v=Math.max(id==='power'?0:1,Math.min(max,+e.target.value));o[id]=v;$('#'+id+'Range').value=v;renderOps()}if(id==='fontSize')$('#arttext').setAttribute('font-size',Math.max(10,Math.min(48,+e.target.value*1.5)));});
document.addEventListener('change',e=>{let o=operations.find(o=>o.id===activeOp);if(e.target.id==='opname'){o.name=e.target.value;renderOps();if(state==='text')$('#arttext').textContent=e.target.value.toUpperCase()}if(e.target.id==='font')$('#arttext').style.fontFamily=e.target.value;if(e.target.id==='statusSelect'){let s=e.target.value;$('#machineStatus').textContent=s+' · ukázka';$('#statusdot').style.background=s==='Chyba'?'#a5362c':s==='Připraveno'?'#5d7650':s==='Nepřipojeno'?'#8c8d85':'#9c762f'}if(e.target.id==='material')toast('Ukázkový materiál; parametry ověřte na skutečném stroji.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();setState(state==='nodes'?'vector':'default')}if(e.target.matches('input,select'))return;if(e.key.toLowerCase()==='v')setState('object');if(e.key.toLowerCase()==='t')setState('text');if(e.key.toLowerCase()==='l')setState('nodes');if(e.key.toLowerCase()==='f')setZoom(82)});
let tipTimer;document.addEventListener('pointerover',e=>{let b=e.target.closest('[data-tip]');if(!b)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>{document.querySelector('.tooltip')?.remove();let t=document.createElement('div');t.className='tooltip';t.textContent=b.dataset.tip;document.body.append(t);let r=b.getBoundingClientRect();t.style.left=Math.min(r.right+7,innerWidth-t.offsetWidth-10)+'px';t.style.top=Math.min(r.top+3,innerHeight-t.offsetHeight-36)+'px'},500)});document.addEventListener('pointerout',()=>{clearTimeout(tipTimer);$('.tooltip')?.remove()});
function updateRulers(){const a=$('.artboard').getBoundingClientRect(),w=$('.workspace').getBoundingClientRect(),scale=a.width/400;$('#rulerx').innerHTML=Array.from({length:61},(_,i)=>{let n=i*20-200;return `<span style="left:${a.left-w.left-26+n*scale}px">${n}</span>`}).join('');$('#rulery').innerHTML=Array.from({length:41},(_,i)=>{let n=i*20-200;return `<span style="top:${a.bottom-w.top-23-n*scale-5}px">${n}</span>`}).join('')}
new ResizeObserver(updateRulers).observe($('.artboard'));
document.addEventListener('keydown',e=>{if(e.target.matches('input,select')||!boxes[state])return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();toast('Přesný posun je v tomto prototypu pouze vizuální ukázka.')}});
hydrate();setState(new URLSearchParams(location.search).get('state') in states?new URLSearchParams(location.search).get('state'):'text');$('#undo').disabled=true;updateRulers();
</script></html>
